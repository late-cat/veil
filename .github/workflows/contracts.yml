name: VEIL CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
        
    - name: Install Compact Compiler
      run: npm install -g @midnight-ntwrk/compact-compiler
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Compile ZK Circuits
      run: npm run compile
      
    - name: Run Midnight Test Suite
      run: npm test
