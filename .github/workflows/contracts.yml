name: VEIL Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
        
    - name: Install Dependencies
      run: npm install
      
    # Note: We do not need to compile the Compact circuits here because
    # the compiled `managed/` assets are already committed to the repository.
    # The tests will run against the pre-compiled circuits.
    
    - name: Run Midnight Test Suite
      run: npm test
