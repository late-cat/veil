name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Compact Compiler
        run: npm install -g @midnight-ntwrk/compact-compiler
        
      - name: Install dependencies (Contracts)
        run: |
          cd mn-demo
          npm install
          
      - name: Compile Compact Contract
        run: |
          cd mn-demo
          npm run compile
          
      - name: Run Contract Tests
        run: |
          cd mn-demo
          npm test
          
      - name: Install dependencies (Frontend)
        run: |
          cd frontend
          npm install
          
      - name: Build Frontend
        run: |
          cd frontend
          npm run build
